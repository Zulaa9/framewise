<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Framewise</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="title"><img src="icons/icon48.png" alt="" class="logo-mark" /> Framewise</span>
    <span class="header-actions">
      <button id="pauseBtn" class="hidden" data-i18n-title="popup.pauseBtn.off">⏸</button>
      <button id="floatBtn" class="hidden" data-i18n-title="popup.floatBtn.title">📌</button>
      <button id="detachBtn" data-i18n-title="popup.detachBtn.title">🗗</button>
      <button id="langToggle" class="lang-toggle" title="EN / ES">ES</button>
      <button id="openOptions" data-i18n-title="popup.openOptions.title">⚙</button>
    </span>
  </header>

  <div id="pausedHint" class="paused-hint hidden" data-i18n="popup.pausedHint"></div>

  <div id="noVideo" class="hint hidden">
    <p data-i18n="popup.noVideo.message"></p>
    <div class="no-video-actions">
      <button id="retryBtn" data-i18n="popup.retryBtn"></button>
      <button id="reloadTabBtn" data-i18n="popup.reloadTabBtn"></button>
      <button id="pickVideoBtn" data-i18n="popup.pickVideoBtn"></button>
    </div>
  </div>

  <section id="controls">
    <div class="row status">
      <span id="stateBadge">--</span>
      <span id="timeBadge">--:--</span>
      <span id="speedBadge">1.00x</span>
    </div>

    <div class="row buttons-row">
      <button id="frameBack" data-i18n-title="popup.frameBack.title" data-i18n="popup.frameBack.label"></button>
      <button id="togglePlay" data-i18n-title="popup.togglePlay.title">⏯</button>
      <button id="frameForward" data-i18n-title="popup.frameForward.title" data-i18n="popup.frameForward.label"></button>
    </div>

    <div class="row buttons-row">
      <button id="seekBack" title="">⏪</button>
      <button id="toggleMute" data-i18n-title="popup.toggleMute.title">🔊</button>
      <button id="seekForward" title="">⏩</button>
    </div>

    <div class="row buttons-row">
      <button id="toggleLoop" title="">🔁</button>
      <button id="togglePip" title="" data-i18n="popup.togglePip.label"></button>
      <button id="screenshot" title="">📸</button>
      <button id="recordClip" title="" data-i18n="popup.recordClip.label.idle"></button>
    </div>

    <div class="section-label"><span data-i18n="popup.speed.sectionLabel"></span> <span class="muted" data-i18n="popup.speed.hint"></span></div>
    <div class="row slider-row">
      <button id="speedDown">−</button>
      <input type="range" id="speedSlider" min="0" max="1" step="1" value="0" />
      <button id="speedUp">+</button>
    </div>
    <div id="speedPresets" class="presets"></div>

    <div class="section-label"><span data-i18n="popup.volume.sectionLabel"></span> <span class="muted" id="volumeMaxHint"></span></div>
    <div class="row slider-row">
      <button id="volumeDown">−</button>
      <input type="range" id="volumeSlider" min="0" max="300" step="5" value="100" />
      <button id="volumeUp">+</button>
    </div>
    <div class="row volume-row">
      <span id="volumeBadge">100%</span>
      <button id="volumeReset" data-i18n-title="popup.volumeReset.title">100%</button>
    </div>

    <div class="section-label" data-i18n="popup.fps.sectionLabel"></div>
    <div class="row fps-row">
      <span id="fpsInfo" data-i18n="popup.fpsInfo.detecting"></span>
      <button id="useDetectedFps" data-i18n-title="popup.useDetectedFps.title" data-i18n="popup.useDetectedFps.label"></button>
    </div>
  </section>

  <footer>
    <a href="#" id="openDomainOptions" data-i18n="popup.footer.domainOptions"></a>
    <span>·</span>
    <a href="#" id="openOptions2" data-i18n="popup.footer.globalOptions"></a>
  </footer>

  <script src="i18n.js"></script>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
